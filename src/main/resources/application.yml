spring:
  application:
    name: falapet-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

falapet:
  http:
    max-json-payload-bytes: ${MAX_JSON_PAYLOAD_BYTES:1048576}
    cursor:
      signing-key: ${CURSOR_SIGNING_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
  structured:
    format:
      console: logstash
