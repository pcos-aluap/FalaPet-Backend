spring:
  application:
    name: falapet-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

falapet:
  auth:
    token-hash-key: ${AUTH_TOKEN_HASH_KEY}
    idempotency-encryption-key: ${AUTH_IDEMPOTENCY_ENCRYPTION_KEY}
    access-ttl: ${AUTH_ACCESS_TTL}
    refresh-ttl: ${AUTH_REFRESH_TTL}
    recovery-ttl: ${AUTH_RECOVERY_TTL}
    compromised-password-sha256: ${AUTH_COMPROMISED_PASSWORD_SHA256:}
    argon2:
      salt-length: ${AUTH_ARGON2_SALT_LENGTH:16}
      hash-length: ${AUTH_ARGON2_HASH_LENGTH:32}
      parallelism: ${AUTH_ARGON2_PARALLELISM:1}
      memory-kib: ${AUTH_ARGON2_MEMORY_KIB:19456}
      iterations: ${AUTH_ARGON2_ITERATIONS:2}
    rate:
      window: ${AUTH_RATE_WINDOW:PT1M}
      max-attempts: ${AUTH_RATE_MAX_ATTEMPTS:10}
  http:
    max-json-payload-bytes: ${MAX_JSON_PAYLOAD_BYTES:1048576}
    cursor:
      signing-key: ${CURSOR_SIGNING_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
  structured:
    format:
      console: logstash
